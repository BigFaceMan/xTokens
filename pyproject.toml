[project]
name = "x-tokens"
version = "0.1.0"
description = "An efficient, lightweight, and easy-to-use LLM inference system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
benchmark = ["aiohttp>=3.10", "datasets>=3.0"]

[tool.setuptools.packages.find]
where = [".", "benchmarks"]
include = ["x_tokens*", "test_serve*"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
